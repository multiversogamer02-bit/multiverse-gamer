# Mantiene despierto el proyecto de Supabase de Multiverse Gamer.
# En el plan gratis, Supabase pausa el proyecto si pasa una semana con poca actividad
# (y mientras está pausado la app no puede iniciar sesión, comprar ni guardar en la nube).
# Esto hace una consulta chiquita a la base todos los días, gratis, desde GitHub.
# Si un día falla (Supabase caído o pausado), GitHub te manda un email.
name: Mantener Supabase despierto

on:
  schedule:
    - cron: "17 12 * * *"   # todos los días a las 9:17 de Argentina (12:17 UTC)
  workflow_dispatch:         # botón "Run workflow" para probarlo a mano

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base de Supabase
        run: |
          # La consulta llega a la base de datos (eso es lo que cuenta como actividad).
          # Sin sesión la base contesta «sin permiso» (código 42501): está bien, quiere
          # decir que la base respondió. Si Supabase está pausado o caído, contesta otra cosa.
          for intento in 1 2 3; do
            codigo=$(curl --silent --output respuesta.txt --write-out "%{http_code}" \
              "https://qokalvdmgigofgpobmel.supabase.co/rest/v1/anuncios?select=id&limit=1" \
              -H "apikey: sb_publishable_7MimMLyy9OtjPrp4_XwsaA_-KWNHacZ")
            echo "Intento $intento: HTTP $codigo"
            cat respuesta.txt; echo ""
            if [ "$codigo" = "200" ] || grep -q "42501" respuesta.txt; then
              echo "Supabase respondió: sigue despierto."
              exit 0
            fi
            sleep 20
          done
          echo "Supabase no respondió bien: puede estar pausado. Entrá al panel de Supabase."
          exit 1
